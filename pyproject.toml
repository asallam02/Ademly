[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ademly"
version = "0.1.0"
description = "Finds matching jobs and prepares accurate, tailored resumes."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "httpx>=0.28",
    "pydantic>=2.14,<3",
    "python-dotenv>=1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]

[project.scripts]
ademly = "ademly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
